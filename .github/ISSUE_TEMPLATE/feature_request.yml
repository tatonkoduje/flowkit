name: Feature request
description: Suggest a new capability or improvement
labels: enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that FlowLite doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see? Keep minimalism in mind.
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Fit
      options:
        - label: This keeps the language surface small.
        - label: This can be deterministic.
        - label: This does not require third-party runtime dependencies.
