name: Bug report
description: Report something that doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Minimal source
      description: The smallest .fl file that reproduces the issue.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What actually happened. Attach the SVG/PNG if relevant.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FlowLite version / commit
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 15 / Ubuntu 24.04"
    validations:
      required: true
  - type: dropdown
    id: png
    attributes:
      label: PNG converter (if used)
      options:
        - none
        - rsvg-convert
        - inkscape
        - qlmanage
    validations:
      required: false
